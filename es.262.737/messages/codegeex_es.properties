settings.repoIndexLabel.text=Indexación de repositorio
settings.repoIndexRemarkLabel.text=<html>Una vez habilitado, crearemos automáticamente un índice de conocimiento para tu base de código, lo que ayuda a mejorar la calidad de las preguntas/respuestas y el autocompletado de código. <br />Admitimos configurar reglas de ignorar para evitar que el plugin lea automáticamente archivos confidenciales (ver la <a href="https://zhipu-ai.feishu.cn/wiki/AWgfwq5YniIfyqk7WNRctXCUnYe">guía</a>). <br />Los resultados del índice solo se utilizan para proporcionar contexto para tus preguntas/respuestas y autocompletados de código, no para entrenamiento. <br />Habilitar esta opción significa que aceptas el <a href="https://codegeex.cn/privacypolicy">Acuerdo de Privacidad</a>.</html>
