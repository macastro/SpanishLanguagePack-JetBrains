settings.privacyLabel.text=Privacidad:
settings.privacyOption.text=<html><body><p align=\"left\">Acepta compartir el código generado únicamente con fines de investigación para mejorar CodeGeeX.<br/>De lo contrario, el código no se almacenará y solo se utilizará para asistir en tu programación.</p></body></html>

