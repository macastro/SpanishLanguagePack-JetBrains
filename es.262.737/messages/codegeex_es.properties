codegeex.jcef.title=Bienvenido a CodeGeeX
codegeex.jcef.step0=Por favor habilita JCEF, sigue los pasos a continuación:
codegeex.jcef.step1=  Haz clic en "Ayuda" en el menú -> "Buscar acción";
codegeex.jcef.step2=  Introduce -> "Choose Boot Java runtime for the IDE" ("Elegir el entorno de ejecución Java de arranque para el IDE");
codegeex.jcef.step3=  Selecciona el entorno de ejecución SDK que admite JCEF
codegeex.jcef.step4=  Haz clic en "Aceptar" y reinicia el IDE.
codegeex.jcef.detailButton=\u2192 Haz clic para ver instrucciones detalladas

codegeex.autoboxcachemax.step0=<html>CodeGeeX ha detectado que una configuración en idea.vmoptions puede causar<br> un mal funcionamiento. Por favor sigue los pasos a continuación para corregirlo:</html>
codegeex.autoboxcachemax.step1=  Haz clic en "Ayuda" en el menú -> "Editar opciones de VM personalizadas...";
codegeex.autoboxcachemax.step2=  Busca la línea -XX:AutoBoxCacheMax y elimínala;
codegeex.autoboxcachemax.step3=  Guarda los cambios y reinicia el IDE.

codegeex.jcefdisabledoptions.step0=<html>CodeGeeX ha detectado que una configuración en .vmoptions puede causar<br> un mal funcionamiento. Por favor sigue los pasos a continuación para corregirlo:</html>
codegeex.jcefdisabledoptions.step1=  Haz clic en "Ayuda" en el menú -> "Editar opciones de VM personalizadas...";
codegeex.jcefdisabledoptions.step2=  Busca la línea "ide.browser.jcef.enabled" y cámbiala a "true";
codegeex.jcefdisabledoptions.step3=  Guarda los cambios y reinicia el IDE.

codegeex.jcefdisabledproperties.step0=<html>CodeGeeX ha detectado que una configuración en idea.properties puede causar<br> un mal funcionamiento. Por favor sigue los pasos a continuación para corregirlo:</html>
codegeex.jcefdisabledproperties.step1=  Haz clic en "Ayuda" en el menú -> "Editar propiedades personalizadas...";
codegeex.jcefdisabledproperties.step2=  Busca la línea "ide.browser.jcef.enabled" y cámbiala a "true";
codegeex.jcefdisabledproperties.step3=  Guarda los cambios y reinicia el IDE.

